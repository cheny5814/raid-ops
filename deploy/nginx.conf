# Install as /etc/nginx/sites-available/raid-ops after certificate issuance.
server {
    listen 80;
    listen [::]:80;
    server_name runandgun.games www.runandgun.games;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/raid-ops/acme;
        try_files $uri =404;
    }
    location / { return 301 https://runandgun.games$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name runandgun.games www.runandgun.games;
    ssl_certificate /etc/letsencrypt/live/runandgun.games/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/runandgun.games/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    if ($host = www.runandgun.games) { return 301 https://runandgun.games$request_uri; }
    root /var/www/raid-ops/current;
    index index.html;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), fullscreen=(self)" always;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;
    include /etc/nginx/snippets/raid-ops-stats.conf;
    rewrite ^/(.+)/$ /$1 permanent;
    location /_nuxt/ { try_files $uri =404; expires 1y; access_log off; }
    location /iron-front/ { try_files $uri =404; expires 1d; access_log off; }
    location / { try_files $uri $uri/index.html $uri.html =404; expires -1; }
    error_page 404 /404.html;
}
