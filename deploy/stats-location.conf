# Include inside the runandgun.games HTTPS server block on the existing backend server.
# The backend must be updated with the runandgun.games site allowlist first.
location = /e {
    limit_except POST { deny all; }
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:3100/api/collect;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}
